# documentation: http://docs.openclaw.ai/
# slogan: OpenClaw - AI-powered multi-channel messaging gateway
# tags: ai,chatbot,messaging,automation
# port: 18789

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-sidecar
    hostname: astra-gateway
    environment:
      - TS_USERSPACE=true
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - /home/node/.openclaw/tailscale:/var/lib/tailscale
      #- /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPENCLAW_DOCKER_APT_PACKAGES=ffmpeg build-essential git jq python3-pip python3-requests nano
        - OPENCLAW_DOCKER_PIP_PACKAGES=scrapling[all]
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - TZ=${OPENCLAW_TZ:-UTC}
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      # OpenClaw configuration
      - OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - OPENCLAW_WORKSPACE_DIR=/home/node/.openclaw/workspace
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_BIND=loopback
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_LOAD_SHELL_ENV=1
      - OPENCLAW_SHELL_ENV_TIMEOUT_MS=15000
      - OPENCLAW_DOCKER_APT_PACKAGES=ffmpeg build-essential git jq python3-pip python3-requests nano
      - OPENCLAW_DOCKER_PIP_PACKAGES=scrapling[all]
      - OPENCLAW_ALLOW_UNCONFIGURED=true
      - CLAWHUB_WORKDIR=/home/node/.openclaw
      - CLAWHUB_DISABLE_TELEMETRY=1
      #- CLAWHUB_REGISTRY=${CLAWDHUB_REGISTRY}
      #- CLAWHUB_SITE=${CLAWDHUB_SITE}
      # Others
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SEARXNG_URL=${SEARXNG_URL}
      - GOG_ACCOUNT=${GOG_ACCOUNT}
    volumes:
      - openclaw-data:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
    init: true
    restart: unless-stopped
    command: [ "node", "dist/index.js", "gateway", "--bind", "loopback", "--allow-unconfigured" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:18789/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
  openclaw-cli:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - BROWSER=echo
      - TZ=${OPENCLAW_TZ:-UTC}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      # General configuration
      - OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - OPENCLAW_WORKSPACE_DIR=/home/node/.openclaw/workspace
      - OPENCLAW_LOAD_SHELL_ENV=1
      - OPENCLAW_SHELL_ENV_TIMEOUT_MS=15000
      - CLAWHUB_WORKDIR=/home/node/.openclaw
      - CLAWHUB_DISABLE_TELEMETRY=1
      #- CLAWHUB_REGISTRY=${CLAWDHUB_REGISTRY}
      #- CLAWHUB_SITE=${CLAWDHUB_SITE}
      # Others
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - openclaw-data:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: [ "node", "dist/index.js" ]
    profiles:
      - cli

volumes:
  openclaw-data:
    driver: local
  openclaw-workspace:
    driver: local
